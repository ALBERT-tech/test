<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Россильбер — портфель проектов и процессы</title>
<style>
  :root {
    --border: #e5eaef;
    --border-strong: #d5dde5;
    --text: #333f4d;
    --text-muted: #7c8794;
    --link: #1e6ec8;
    --bg: #eef2f4;
    --panel: #ffffff;
    --hover: #f5f9fc;
    --accent: #2fc6f6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 14px/1.45 "Helvetica Neue", "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  .topbar {
    background: #535c69;
    color: #fff;
    padding: 12px 24px;
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  .topbar h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .topbar .meta { font-size: 12px; color: #bdc4cc; }
  .wrap { padding: 16px 24px 40px; }

  .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .tab {
    background: transparent; border: none; cursor: pointer;
    font: 600 13px/1 inherit; text-transform: uppercase; letter-spacing: .3px;
    color: var(--text-muted); padding: 10px 14px 12px; border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab:hover { color: var(--text); }

  .filters {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; margin-bottom: 12px;
  }
  .filters select, .filters input[type=search] {
    font: inherit; color: var(--text);
    border: 1px solid var(--border-strong); border-radius: 4px;
    padding: 6px 8px; background: #fff; max-width: 340px;
  }
  .filters input[type=search] { flex: 1 1 220px; min-width: 180px; }
  .filters select:focus, .filters input:focus { outline: none; border-color: var(--accent); }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 14px; font-size: 12px; color: var(--text-muted);
  }
  .chip b { display: block; font-size: 18px; color: var(--text); }
  .chip.c-top b { color: #b45309; }
  .chip.c-active b { color: #0369a1; }
  .chip.c-done b { color: #15803d; }
  .chip.c-overdue b { color: #b91c1c; }

  .grid-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    overflow: auto; max-height: calc(100vh - 118px);
  }
  table { border-collapse: collapse; width: 100%; }
  thead th {
    position: sticky; top: 0; z-index: 5;
    background: #f8fafb; color: var(--text-muted);
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px;
    text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border-strong);
    white-space: nowrap; cursor: pointer; user-select: none;
  }
  thead th .arr { color: var(--accent); margin-left: 3px; }
  tbody td {
    padding: 8px 10px; border-bottom: 1px solid var(--border);
    vertical-align: top; white-space: pre-line; min-width: 110px; max-width: 360px;
  }
  tbody tr:hover td { background: var(--hover); }
  td.num { text-align: right; min-width: 60px; }
  td.nowrap { white-space: nowrap; }
  .dir-cell { color: var(--text-muted); font-size: 12px; min-width: 150px; }
  .title-cell { font-weight: 600; min-width: 240px; }
  .fire { margin-left: 4px; }
  .status {
    display: inline-block; font-size: 12px; font-weight: 600;
    border-radius: 10px; padding: 2px 10px; white-space: nowrap;
  }
  .st-active  { background: #e0f2fe; color: #0369a1; }
  .st-done    { background: #dcfce7; color: #15803d; }
  .st-overdue { background: #fee2e2; color: #b91c1c; }
  .deadline-overdue { color: #b91c1c; font-weight: 600; }
  .empty-note { padding: 30px; text-align: center; color: var(--text-muted); }

  .proc-link { color: var(--link); text-decoration: none; cursor: pointer; }
  .proc-link:hover { text-decoration: underline; }

  /* ---- карточка процесса (как в Bitrix) ---- */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(40, 48, 57, .55);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 30px 16px; overflow: auto;
  }
  .b-card {
    background: var(--bg); border-radius: 8px; width: 100%; max-width: 900px;
    box-shadow: 0 10px 40px rgba(0,0,0,.3); overflow: hidden;
  }
  .b-card-head {
    background: var(--panel); border-bottom: 1px solid var(--border-strong);
    padding: 14px 20px; display: flex; align-items: center; gap: 12px;
  }
  .b-card-head h2 { margin: 0; font-size: 16px; text-transform: uppercase; flex: 1; }
  .b-close {
    border: none; background: none; font-size: 22px; line-height: 1;
    color: var(--text-muted); cursor: pointer; padding: 2px 8px;
  }
  .b-close:hover { color: var(--text); }
  .b-card-body { padding: 16px 20px 20px; }
  .b-strip { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
  .b-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .b-panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 14px; flex: 1 1 260px; min-width: 240px;
  }
  .b-panel .b-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .b-panel a { color: var(--link); text-decoration: none; }
  .b-panel a:hover { text-decoration: underline; }
  .b-list { list-style: none; margin: 4px 0 0; padding: 0; }
  .b-list li {
    display: flex; align-items: baseline; gap: 10px; justify-content: space-between;
    padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--border);
  }
  .b-list li:last-child { border-bottom: none; }
  .b-item-title { flex: 1; min-width: 0; }
  .b-item-meta { color: var(--text-muted); font-size: 12px; white-space: nowrap; text-align: right; }
  .b-item-meta .deadline-overdue { font-size: 12px; }
  .b-done, .b-done a { text-decoration: line-through; color: var(--text-muted) !important; }
  .b-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .b-field {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px;
  }
  .b-field .b-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .b-field .b-val { font-size: 13px; white-space: pre-line; min-height: 18px; }
  .b-footer {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
    font-size: 13px; color: var(--text-muted);
  }
  .b-footer a { color: var(--link); }

  .nodata {
    max-width: 640px; margin: 60px auto; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 28px 32px;
  }
  .nodata code { background: #f2f4f6; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  .nodata h2 { margin-top: 0; }
</style>
</head>
<body>
<div class="topbar">
  <h1>Россильбер · портфель проектов</h1>
  <span class="meta" id="meta"></span>
</div>

<div class="wrap" id="app" style="display:none">
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="projects">Проекты</button>
    <button class="tab" data-tab="processes">Процессы</button>
    <button class="tab" data-tab="directions">Направления</button>
  </div>

  <div class="filters">
    <select id="f-dir"></select>
    <select id="f-place"></select>
    <select id="f-status">
      <option value="">Все статусы</option>
      <option value="top">Топ 🔥</option>
      <option value="active">Выполняется</option>
      <option value="done">Завершено</option>
      <option value="overdue">Просрочен</option>
    </select>
    <input type="search" id="f-q" placeholder="Поиск по названию, лидеру, целям…">
  </div>

  <div class="chips" id="chips"></div>
  <div class="grid-box"><table id="grid"><thead></thead><tbody></tbody></table></div>
</div>

<div class="nodata" id="nodata" style="display:none">
  <h2>Нет данных</h2>
  <p>Рядом с этим файлом должен лежать <code>rb-data.js</code> — выгрузка из Bitrix.</p>
  <p>Сформируйте её скриптом (в этой же папке):</p>
  <p><code>powershell -ExecutionPolicy Bypass -File .\export-rb-data.ps1 https://адрес/путь/api КЛЮЧ</code></p>
  <p>и обновите эту страницу (F5).</p>
</div>

<div id="modal" style="display:none"></div>

<script src="rb-data.js"></script>
<script>
(function () {
  // Приводим значение к массиву в любой из форм, которые отдаёт PowerShell 5.1:
  // нормальный массив, обёртка {"value":[...],"Count":N}, объект с числовыми
  // ключами (PHP json_encode ассоциативного массива) или одиночный объект.
  function arr(v) {
    if (Array.isArray(v)) return v;
    if (v && typeof v === "object") {
      if (Array.isArray(v.value)) return v.value;
      var keys = Object.keys(v);
      if (keys.length && keys.every(function (k) { return /^\d+$/.test(k); })) {
        return keys.sort(function (a, b) { return a - b; }).map(function (k) { return v[k]; });
      }
      return [v];
    }
    return [];
  }

  var D = window.RB_DATA;
  if (D && D.directions) {
    D.directions = arr(D.directions).map(function (d) {
      d.processes = arr(d.processes);
      d.projects = arr(d.projects);
      return d;
    });
  }
  if (!D || !Array.isArray(D.directions)) {
    document.getElementById("nodata").style.display = "block";
    return;
  }
  document.getElementById("app").style.display = "block";
  document.getElementById("meta").textContent =
    "выгрузка от " + (D.generated || "?") + " · " + (D.source || "");

  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function norm(v) { return String(v == null ? "" : v).replace(/\r?\n\s*\r?\n/g, "\n").trim(); }

  var today = new Date(); today.setHours(0, 0, 0, 0);
  function isOverdue(p) {
    if (p.STATUS == 5 || !p.DEADLINE) return false;
    var d = new Date(p.DEADLINE);
    if (isNaN(d.getTime())) return false;
    d.setHours(0, 0, 0, 0);
    return d < today;
  }
  function statusOf(p) {
    if (p.STATUS == 5) return "done";
    if (isOverdue(p)) return "overdue";
    return "active";
  }

  var projects = [], processes = [];
  D.directions.forEach(function (dir) {
    (dir.projects || []).forEach(function (p) {
      projects.push(Object.assign({ __dir: dir.name }, p));
    });
    (dir.processes || []).forEach(function (p) {
      processes.push(Object.assign({ __dir: dir.name }, p));
    });
  });

  // Карточки процессов из process.php (несут Bitrix-ID); сопоставляем по названию
  var processCards = arr(D.processCards);
  var cardByTitle = {};
  processCards.forEach(function (c) {
    var k = String(c.TITLE || "").trim().toLowerCase();
    if (k && !cardByTitle[k]) cardByTitle[k] = c;
  });
  var dirByName = {};
  D.directions.forEach(function (d) { dirByName[String(d.name).trim()] = d; });

  var origin = String(D.source || "").replace(/^(https?:\/\/[^\/]+).*$/, "$1");
  function taskUrl(id) {
    return origin + "/company/personal/user/297/tasks/task/view/" + encodeURIComponent(String(id)) + "/";
  }
  function rowTaskId(row) {
    if (!row || typeof row !== "object") return "";
    var keys = ["ID", "id", "Id", "TASK_ID", "task_id"];
    for (var i = 0; i < keys.length; i++) {
      if (row[keys[i]] != null && String(row[keys[i]]).trim() !== "") return String(row[keys[i]]).trim();
    }
    return "";
  }

  var $ = function (id) { return document.getElementById(id); };
  var state = { tab: "projects", dir: "", place: "", status: "", q: "", sortKey: "", sortDir: 1 };
  var lastProcessRows = [];

  function fillSelect(el, values, allLabel) {
    el.innerHTML = '<option value="">' + allLabel + "</option>" +
      values.map(function (v) { return '<option value="' + esc(v) + '">' + esc(v) + "</option>"; }).join("");
  }
  fillSelect($("f-dir"), D.directions.map(function (d) { return d.name; }), "Все направления");
  var places = {};
  projects.forEach(function (p) { places[norm(p.place) || "Без площадки"] = 1; });
  fillSelect($("f-place"), Object.keys(places).sort(), "Все площадки");

  function matchQ(row, keys) {
    if (!state.q) return true;
    var q = state.q.toLowerCase();
    return keys.some(function (k) { return String(row[k] == null ? "" : row[k]).toLowerCase().indexOf(q) >= 0; });
  }

  function filteredProjects() {
    return projects.filter(function (p) {
      if (state.dir && p.__dir !== state.dir) return false;
      if (state.place && (norm(p.place) || "Без площадки") !== state.place) return false;
      if (state.status === "top" && p.PRIORITY != 2) return false;
      if (["active", "done", "overdue"].indexOf(state.status) >= 0 && statusOf(p) !== state.status) return false;
      return matchQ(p, ["TITLE", "place", "RESPONSIBLE", "strateg_target", "PROCESS_OF_PROJECT", "effect_plan", "effect_fact", "__dir"]);
    });
  }
  function filteredProcesses() {
    return processes.filter(function (p) {
      if (state.dir && p.__dir !== state.dir) return false;
      return matchQ(p, ["TITLE", "current_state", "target_state", "metrics", "kpi_2026", "__dir"]);
    });
  }

  function sortRows(rows, defaultCmp) {
    if (!state.sortKey) return rows.slice().sort(defaultCmp);
    var k = state.sortKey, d = state.sortDir;
    return rows.slice().sort(function (a, b) {
      var av = String(a[k] == null ? "" : a[k]), bv = String(b[k] == null ? "" : b[k]);
      var an = parseFloat(av), bn = parseFloat(bv);
      if (!isNaN(an) && !isNaN(bn) && String(an) === av.trim() && String(bn) === bv.trim()) return (an - bn) * d;
      return av.localeCompare(bv, "ru") * d;
    });
  }

  var PROJECT_COLS = [
    ["__dir", "Направление"], ["place", "Площадка"], ["TITLE", "Проект"],
    ["PROCESS_OF_PROJECT", "Процесс"], ["__status", "Статус"], ["DEADLINE", "Срок"],
    ["RESPONSIBLE", "Лидер проекта"], ["effect_plan", "Эффект план"],
    ["effect_fact", "Эффект факт"], ["strateg_target", "Влияние на страт. цель"]
  ];
  var PROCESS_COLS = [
    ["__dir", "Направление"], ["TITLE", "Процесс"], ["current_state", "Текущее состояние"],
    ["target_state", "Целевое состояние"], ["metrics", "Метрики"], ["kpi_2026", "KPI 2026"],
    ["january", "Янв"], ["february", "Фев"], ["march", "Мар"], ["quarter_1", "I кв."],
    ["april", "Апр"], ["may", "Май"], ["june", "Июн"], ["quarter_2", "II кв."]
  ];
  var DIRECTION_COLS = [
    ["name", "Направление"], ["__proc", "Процессов"], ["__proj", "Проектов"],
    ["__top", "Топ 🔥"], ["__active", "Выполняется"], ["__done", "Завершено"], ["__overdue", "Просрочено"]
  ];

  function renderHead(cols) {
    document.querySelector("#grid thead").innerHTML = "<tr>" + cols.map(function (c) {
      var arr = state.sortKey === c[0] ? '<span class="arr">' + (state.sortDir > 0 ? "▲" : "▼") + "</span>" : "";
      return '<th data-key="' + c[0] + '">' + c[1] + arr + "</th>";
    }).join("") + "</tr>";
  }

  function statusCell(p) {
    var s = statusOf(p);
    var label = s === "done" ? "Завершено" : s === "overdue" ? "Просрочен" : "Выполняется";
    return '<span class="status st-' + s + '">' + label + "</span>";
  }

  // ---------- карточка процесса ----------
  var modal = document.getElementById("modal");

  function projectItem(p) {
    var pid = rowTaskId(p);
    var done = p.STATUS == 5;
    var label = esc(norm(p.TITLE)) + (p.PRIORITY == 2 ? ' <span class="fire">🔥</span>' : "");
    var title = pid ? '<a href="' + esc(taskUrl(pid)) + '" target="_blank" rel="noopener">' + label + "</a>" : label;
    var dl = String(p.DEADLINE || "").trim();
    var meta = esc(p.RESPONSIBLE || "") +
      (dl ? " · " + (isOverdue(p) ? '<span class="deadline-overdue">' + esc(dl) + "</span>" : esc(dl)) : " · Без срока");
    return '<li' + (done ? ' class="b-done"' : "") + '><span class="b-item-title">' + title +
      '</span><span class="b-item-meta">' + meta + "</span></li>";
  }

  function openProcessCard(row) {
    var title = norm(row.TITLE);
    var card = cardByTitle[title.trim().toLowerCase()] || null;
    var procId = rowTaskId(row) || (card ? String(card.id) : "");
    var dirName = row.__dir || (card ? card.direction : "") || "";
    var dirObj = dirByName[String(dirName).trim()] || null;
    var dirTaskId = dirObj && dirObj.task_id ? String(dirObj.task_id) : "";

    var related = projects.filter(function (p) {
      return String(p.PROCESS_OF_PROJECT || "").trim() === title.trim();
    });
    var top = related.filter(function (p) { return p.PRIORITY == 2; });
    var usual = related.filter(function (p) { return p.PRIORITY != 2; });

    function fieldVal(k) {
      var v = row[k];
      if ((v == null || String(v).trim() === "") && card) v = card[k];
      return norm(v);
    }
    var FIELDS = [
      ["current_state", "Текущее состояние"], ["target_state", "Целевое состояние"], ["metrics", "Метрики"],
      ["kpi_2026", "KPI 2026"], ["january", "KPI январь"], ["february", "KPI февраль"], ["march", "KPI март"],
      ["quarter_1", "KPI 1-Квартал"], ["april", "KPI апрель"], ["may", "KPI май"], ["june", "KPI июнь"],
      ["quarter_2", "KPI II кв."]
    ];

    modal.innerHTML =
      '<div class="overlay">' +
        '<div class="b-card">' +
          '<div class="b-card-head"><h2>' + esc(title) + '</h2><button class="b-close" title="Закрыть">×</button></div>' +
          '<div class="b-card-body">' +
            '<div class="b-strip">Процесс: ' + esc(title) + "</div>" +
            '<div class="b-row">' +
              '<div class="b-panel"><div class="b-label">Направление (родительская задача)</div>' +
                (dirName
                  ? (dirTaskId
                      ? '<a href="' + esc(taskUrl(dirTaskId)) + '" target="_blank" rel="noopener">' + esc(dirName) + "</a>"
                      : esc(dirName))
                  : '<span style="color:var(--text-muted)">Без направления</span>') +
              "</div>" +
              '<div class="b-panel"><div class="b-label">Процесс</div>' +
                (procId
                  ? '<a href="' + esc(taskUrl(procId)) + '" target="_blank" rel="noopener">' + esc(title) + "</a>"
                  : esc(title)) +
              "</div>" +
            "</div>" +
            '<div class="b-panel" style="margin-bottom:12px">' +
              '<div class="b-label">Связанные проекты (подзадачи)</div>' +
              (related.length
                ? '<div class="b-row" style="margin-bottom:0">' +
                    '<div class="b-panel"><div class="b-label">Топ-проекты</div>' +
                      (top.length ? '<ul class="b-list">' + top.map(projectItem).join("") + "</ul>" : '<span style="color:var(--text-muted)">—</span>') +
                    "</div>" +
                    '<div class="b-panel"><div class="b-label">Обычные проекты</div>' +
                      (usual.length ? '<ul class="b-list">' + usual.map(projectItem).join("") + "</ul>" : '<span style="color:var(--text-muted)">—</span>') +
                    "</div>" +
                  "</div>"
                : '<span style="color:var(--text-muted)">Нет связанных проектов</span>') +
            "</div>" +
            '<div class="b-label" style="font-size:12px;color:var(--text-muted);margin-bottom:6px">Поля процесса</div>' +
            '<div class="b-fields">' +
              FIELDS.map(function (f) {
                return '<div class="b-field"><div class="b-label">' + f[1] + '</div><div class="b-val">' + esc(fieldVal(f[0])) + "</div></div>";
              }).join("") +
            "</div>" +
            '<div class="b-footer">' +
              (procId
                ? 'Задача Bitrix24: <a href="' + esc(taskUrl(procId)) + '" target="_blank" rel="noopener">' + esc(taskUrl(procId)) + "</a>"
                : "ID Bitrix24: не найден (перевыгрузите данные новой версией export-rb-data.ps1)") +
            "</div>" +
          "</div>" +
        "</div>" +
      "</div>";
    modal.style.display = "block";
  }

  function closeCard() { modal.style.display = "none"; modal.innerHTML = ""; }
  modal.addEventListener("click", function (e) {
    if (e.target.classList.contains("overlay") || e.target.classList.contains("b-close")) closeCard();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeCard(); });

  function renderChips(rows) {
    var top = 0, done = 0, overdue = 0;
    rows.forEach(function (p) {
      if (p.PRIORITY == 2) top++;
      var s = statusOf(p);
      if (s === "done") done++; else if (s === "overdue") overdue++;
    });
    $("chips").innerHTML =
      '<div class="chip">Всего<b>' + rows.length + "</b></div>" +
      '<div class="chip c-top">Топ 🔥<b>' + top + "</b></div>" +
      '<div class="chip c-active">Выполняется<b>' + (rows.length - done - overdue) + "</b></div>" +
      '<div class="chip c-done">Завершено<b>' + done + "</b></div>" +
      '<div class="chip c-overdue">Просрочено<b>' + overdue + "</b></div>";
  }

  function render() {
    var tbody = document.querySelector("#grid tbody");
    var isProjects = state.tab === "projects";
    $("f-place").style.display = isProjects ? "" : "none";
    $("f-status").style.display = isProjects ? "" : "none";
    $("f-dir").style.display = state.tab === "directions" ? "none" : "";

    if (state.tab === "projects") {
      var rows = sortRows(filteredProjects(), function (a, b) {
        return ((b.PRIORITY == 2) - (a.PRIORITY == 2)) || String(a.__dir).localeCompare(String(b.__dir), "ru");
      });
      renderChips(rows);
      renderHead(PROJECT_COLS);
      tbody.innerHTML = rows.map(function (p) {
        return "<tr>" +
          '<td class="dir-cell">' + esc(p.__dir) + "</td>" +
          "<td>" + esc(norm(p.place) || "Без площадки") + "</td>" +
          '<td class="title-cell">' + esc(norm(p.TITLE)) + (p.PRIORITY == 2 ? '<span class="fire">🔥</span>' : "") + "</td>" +
          "<td>" + esc(norm(p.PROCESS_OF_PROJECT)) + "</td>" +
          '<td class="nowrap">' + statusCell(p) + "</td>" +
          '<td class="nowrap' + (isOverdue(p) ? " deadline-overdue" : "") + '">' + esc(p.DEADLINE || "Нет даты") + "</td>" +
          "<td>" + esc(p.RESPONSIBLE || "") + "</td>" +
          "<td>" + esc(norm(p.effect_plan)) + "</td>" +
          "<td>" + esc(norm(p.effect_fact)) + "</td>" +
          "<td>" + esc(norm(p.strateg_target)) + "</td>" +
        "</tr>";
      }).join("") || '<tr><td colspan="10" class="empty-note">Ничего не найдено</td></tr>';
    } else if (state.tab === "processes") {
      var rows2 = sortRows(filteredProcesses(), function (a, b) {
        return String(a.__dir).localeCompare(String(b.__dir), "ru") || String(a.TITLE || "").localeCompare(String(b.TITLE || ""), "ru");
      });
      $("chips").innerHTML = '<div class="chip">Всего процессов<b>' + rows2.length + "</b></div>";
      renderHead(PROCESS_COLS);
      lastProcessRows = rows2;
      tbody.innerHTML = rows2.map(function (p, ri) {
        return "<tr>" + PROCESS_COLS.map(function (c, i) {
          if (i === 1) {
            return '<td class="title-cell"><a class="proc-link" href="#" data-ri="' + ri + '">' + esc(norm(p[c[0]])) + "</a></td>";
          }
          var cls = i === 0 ? ' class="dir-cell"' : "";
          return "<td" + cls + ">" + esc(norm(p[c[0]])) + "</td>";
        }).join("") + "</tr>";
      }).join("") || '<tr><td colspan="14" class="empty-note">Ничего не найдено</td></tr>';
    } else {
      var dirRows = D.directions.map(function (d) {
        var projs = (d.projects || []);
        var stat = { name: d.name, __proc: (d.processes || []).length, __proj: projs.length, __top: 0, __done: 0, __overdue: 0 };
        projs.forEach(function (p) {
          if (p.PRIORITY == 2) stat.__top++;
          var s = statusOf(p);
          if (s === "done") stat.__done++; else if (s === "overdue") stat.__overdue++;
        });
        stat.__active = stat.__proj - stat.__done - stat.__overdue;
        return stat;
      });
      dirRows = sortRows(dirRows, function (a, b) { return String(a.name).localeCompare(String(b.name), "ru"); });
      $("chips").innerHTML = '<div class="chip">Направлений<b>' + dirRows.length + "</b></div>";
      renderHead(DIRECTION_COLS);
      tbody.innerHTML = dirRows.map(function (d) {
        return "<tr>" +
          '<td class="title-cell">' + esc(d.name) + "</td>" +
          '<td class="num">' + d.__proc + "</td>" +
          '<td class="num">' + d.__proj + "</td>" +
          '<td class="num">' + d.__top + "</td>" +
          '<td class="num">' + d.__active + "</td>" +
          '<td class="num">' + d.__done + "</td>" +
          '<td class="num">' + (d.__overdue ? '<span class="deadline-overdue">' + d.__overdue + "</span>" : 0) + "</td>" +
        "</tr>";
      }).join("");
    }
  }

  document.getElementById("tabs").addEventListener("click", function (e) {
    var tab = e.target.getAttribute("data-tab");
    if (!tab) return;
    state.tab = tab; state.sortKey = "";
    document.querySelectorAll(".tab").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-tab") === tab); });
    render();
  });
  document.querySelector("#grid tbody").addEventListener("click", function (e) {
    var a = e.target.closest("a.proc-link");
    if (!a) return;
    e.preventDefault();
    var row = lastProcessRows[+a.getAttribute("data-ri")];
    if (row) openProcessCard(row);
  });
  document.querySelector("#grid thead").addEventListener("click", function (e) {
    var th = e.target.closest("th");
    if (!th) return;
    var key = th.getAttribute("data-key");
    if (state.sortKey === key) { state.sortDir = -state.sortDir; } else { state.sortKey = key; state.sortDir = 1; }
    render();
  });
  $("f-dir").addEventListener("change", function () { state.dir = this.value; render(); });
  $("f-place").addEventListener("change", function () { state.place = this.value; render(); });
  $("f-status").addEventListener("change", function () { state.status = this.value; render(); });
  $("f-q").addEventListener("input", function () { state.q = this.value.trim(); render(); });

  render();
})();
</script>
</body>
</html>
